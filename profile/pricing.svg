<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc">
  <title id="title">Product</title>
  <desc id="desc">Tournaments are $50 per team. Tryouts are $10 per athlete.</desc>
  <defs>
  <filter id="shadow" x="-12%" y="-16%" width="124%" height="148%">
    <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#111111" flood-opacity="0.08"/>
  </filter>
  <filter id="menuShadow" x="-20%" y="-20%" width="150%" height="160%">
    <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#111111" flood-opacity="0.08"/>
  </filter>
  <linearGradient id="glint" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset=".5" stop-color="#ffffff" stop-opacity=".45"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <pattern id="hatch" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
    <rect width="20" height="20" fill="#f7f7f7"/>
    <rect x="10" width="10" height="20" fill="#efefef"/>
  </pattern>
</defs>
  <style>
    text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .rise { animation: rise .7s cubic-bezier(.22,1,.36,1) both; transform-box: fill-box; }
    .d1 { animation-delay: .08s; } .d2 { animation-delay: .18s; }
    .d3 { animation-delay: .3s; } .d4 { animation-delay: .42s; }
    .d5 { animation-delay: .54s; } .d6 { animation-delay: .66s; }
    .d7 { animation-delay: .78s; } .d8 { animation-delay: .9s; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: none; }
    }
    .pill {
      transform-box: fill-box; transform-origin: left center;
      animation: pill 16s cubic-bezier(.22,1,.36,1) infinite;
    }
    @keyframes pill {
      0%, 16% { transform: translateX(0); }
      24%, 40% { transform: translateX(108px); }
      48%, 62% { transform: translateX(214px); }
      70%, 84% { transform: translateX(308px); }
      92%, 100% { transform: translateX(0); }
    }
    .menu {
      opacity: 0; transform: translateY(-6px);
      transform-box: fill-box; transform-origin: top center;
      animation: menu 16s cubic-bezier(.22,1,.36,1) infinite;
    }
    @keyframes menu {
      0%, 6% { opacity: 0; transform: translateY(-6px); }
      10%, 28% { opacity: 1; transform: none; }
      34%, 100% { opacity: 0; transform: translateY(-6px); }
    }
    .chev {
      transform-box: fill-box; transform-origin: center;
      animation: chev 16s cubic-bezier(.22,1,.36,1) infinite;
    }
    @keyframes chev {
      0%, 6% { transform: rotate(0deg); }
      10%, 28% { transform: rotate(180deg); }
      34%, 100% { transform: rotate(0deg); }
    }
    .glint { animation: sweep 6.8s ease-in-out infinite; transform-box: fill-box; transform-origin: left center; }
    @keyframes sweep {
      0%, 58% { transform: translateX(0); }
      100% { transform: translateX(460px); }
    }
    .home { animation: home 14s ease-in-out infinite; }
    .sched { opacity: 0; animation: sched 14s ease-in-out infinite; }
    @keyframes home {
      0%, 38% { opacity: 1; }
      48%, 88% { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes sched {
      0%, 38% { opacity: 0; }
      48%, 88% { opacity: 1; }
      100% { opacity: 0; }
    }
    .lane { animation: slide .65s cubic-bezier(.22,1,.36,1) both; transform-box: fill-box; }
    @keyframes slide {
      from { opacity: 0; transform: translateX(-12px); }
      to { opacity: 1; transform: none; }
    }
    .clash { animation: pulse 2.2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
    .live { animation: blink 1.5s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: .25; } }
    .check {
      fill: none; stroke: #171717; stroke-width: 1.8;
      stroke-linecap: round; stroke-linejoin: round;
      stroke-dasharray: 20; stroke-dashoffset: 20;
      animation: draw 5.2s cubic-bezier(.22,1,.36,1) infinite;
    }
    @keyframes draw {
      0% { stroke-dashoffset: 20; }
      14%, 76% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 20; }
    }
    .float { animation: float 6.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center top; }
    .float2 { animation-delay: -2.4s; }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .tick { opacity: 0; animation: tick 6.4s cubic-bezier(.22,1,.36,1) infinite; transform-box: fill-box; }
    .t1 { animation-delay: 1.6s; } .t2 { animation-delay: 3.2s; } .t3 { animation-delay: 4.8s; }
    @keyframes tick {
      0% { opacity: 0; transform: translateY(6px); }
      3%, 24% { opacity: 1; transform: none; }
      28%, 100% { opacity: 0; transform: translateY(-6px); }
    }
    .dest { opacity: 0; animation: dest 9s cubic-bezier(.22,1,.36,1) infinite both; transform-box: fill-box; }
    .s2 { animation-delay: 3s; } .s3 { animation-delay: 6s; }
    @keyframes dest {
      0% { opacity: 0; transform: translateY(10px); }
      6%, 28% { opacity: 1; transform: none; }
      34%, 100% { opacity: 0; transform: translateY(-10px); }
    }
    .hi { animation: hi 7.2s cubic-bezier(.22,1,.36,1) infinite; }
    .h2 { animation-delay: 2.4s; } .h3 { animation-delay: 4.8s; }
    @keyframes hi {
      0%, 8% { opacity: 0; }
      14%, 30% { opacity: 1; }
      38%, 100% { opacity: 0; }
    }
    .rule {
      stroke-dasharray: 1000; stroke-dashoffset: 1000;
      animation: rule 3.4s cubic-bezier(.22,1,.36,1) infinite;
    }
    @keyframes rule {
      0% { stroke-dashoffset: 1000; opacity: 0; }
      18% { opacity: 1; }
      62%, 100% { stroke-dashoffset: 0; opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .rise, .pill, .menu, .chev, .glint, .home, .sched, .lane, .clash, .live,
      .check, .float, .tick, .dest, .hi, .rule { animation: none; }
      .menu, .sched, .tick, .dest { opacity: 0; }
      .dest.show, .tick.show { opacity: 1; }
      .check { stroke-dashoffset: 0; }
      .rise, .lane { opacity: 1; transform: none; }
    }
</style>
  <rect width="1200" height="710" fill="#ffffff"/>
  
  
  <rect x="519.0" y="28" width="162" height="42" rx="21" fill="#f3f3f3"/>
  <text x="600" y="55" text-anchor="middle" fill="#404040" font-size="18" font-weight="650">Product</text>

  
    <g class="float ">
      <rect x="40" y="120" width="544" height="548" rx="16" fill="#ffffff" stroke="#e5e5e5"/>
      <text x="76" y="178" fill="#171717" font-size="36" font-weight="700" letter-spacing="-0.8">Tournaments</text>
      <text x="76" y="214" fill="#737373" font-size="18">Automate administration</text>
      <text x="76" y="292" fill="#171717" font-size="60" font-weight="700" letter-spacing="-1.6">$50</text>
      <text x="216" y="292" fill="#171717" font-size="24">/ team</text>
      <rect x="76" y="316" width="472" height="48" rx="9" fill="#1c74bb"/>
      <text x="312" y="346" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="650">Get VOS</text>
      <svg x="76" y="392" width="16" height="16" viewBox="0 0 16 16">
      <path class="check" pathLength="20" d="M3.2 8.2 6.1 11l6.7-7" style="animation-delay:0.2s"/>
    </svg><text x="102" y="405" fill="#171717" font-size="16">Set venues, teams, format, and playoffs</text><svg x="76" y="426" width="16" height="16" viewBox="0 0 16 16">
      <path class="check" pathLength="20" d="M3.2 8.2 6.1 11l6.7-7" style="animation-delay:0.32s"/>
    </svg><text x="102" y="439" fill="#171717" font-size="16">Schedules built around your courts</text><svg x="76" y="460" width="16" height="16" viewBox="0 0 16 16">
      <path class="check" pathLength="20" d="M3.2 8.2 6.1 11l6.7-7" style="animation-delay:0.44s"/>
    </svg><text x="102" y="473" fill="#171717" font-size="16">Public tournament page</text><svg x="76" y="494" width="16" height="16" viewBox="0 0 16 16">
      <path class="check" pathLength="20" d="M3.2 8.2 6.1 11l6.7-7" style="animation-delay:0.56s"/>
    </svg><text x="102" y="507" fill="#171717" font-size="16">Live schedule teams can open without signing in</text><svg x="76" y="528" width="16" height="16" viewBox="0 0 16 16">
      <path class="check" pathLength="20" d="M3.2 8.2 6.1 11l6.7-7" style="animation-delay:0.6799999999999999s"/>
    </svg><text x="102" y="541" fill="#171717" font-size="16">Referee assignments</text>
    </g>
  
    <g class="float float2">
      <rect x="616" y="120" width="544" height="548" rx="16" fill="#ffffff" stroke="#e5e5e5"/>
      <text x="652" y="178" fill="#171717" font-size="36" font-weight="700" letter-spacing="-0.8">Tryouts</text>
      <text x="652" y="214" fill="#737373" font-size="18">End-to-end management</text>
      <text x="652" y="292" fill="#171717" font-size="60" font-weight="700" letter-spacing="-1.6">$10</text>
      <text x="792" y="292" fill="#171717" font-size="24">/ athlete</text>
      <rect x="652" y="316" width="472" height="48" rx="9" fill="#1c74bb"/>
      <text x="888" y="346" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="650">Get VOS</text>
      <svg x="652" y="392" width="16" height="16" viewBox="0 0 16 16">
      <path class="check" pathLength="20" d="M3.2 8.2 6.1 11l6.7-7" style="animation-delay:0.35s"/>
    </svg><text x="678" y="405" fill="#171717" font-size="16">One public signup link</text><svg x="652" y="426" width="16" height="16" viewBox="0 0 16 16">
      <path class="check" pathLength="20" d="M3.2 8.2 6.1 11l6.7-7" style="animation-delay:0.47s"/>
    </svg><text x="678" y="439" fill="#171717" font-size="16">Athlete and parent registration</text><svg x="652" y="460" width="16" height="16" viewBox="0 0 16 16">
      <path class="check" pathLength="20" d="M3.2 8.2 6.1 11l6.7-7" style="animation-delay:0.59s"/>
    </svg><text x="678" y="473" fill="#171717" font-size="16">Review, waitlist, and select</text><svg x="652" y="494" width="16" height="16" viewBox="0 0 16 16">
      <path class="check" pathLength="20" d="M3.2 8.2 6.1 11l6.7-7" style="animation-delay:0.71s"/>
    </svg><text x="678" y="507" fill="#171717" font-size="16">Move selected athletes onto a roster</text><svg x="652" y="528" width="16" height="16" viewBox="0 0 16 16">
      <path class="check" pathLength="20" d="M3.2 8.2 6.1 11l6.7-7" style="animation-delay:0.83s"/>
    </svg><text x="678" y="541" fill="#171717" font-size="16">Status updates in VOS</text>
    </g>

</svg>
