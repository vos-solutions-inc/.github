<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Tournaments</title>
  <desc id="desc">Automate dozens of hours of tournament admin. Set venues, teams, and format, then publish a public tournament page. Schedule hundreds of teams.</desc>
  <defs>
  <filter id="shadow" x="-12%" y="-16%" width="124%" height="148%">
    <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#111111" flood-opacity="0.08"/>
  </filter>
  <filter id="menuShadow" x="-20%" y="-20%" width="150%" height="160%">
    <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#111111" flood-opacity="0.08"/>
  </filter>
  <linearGradient id="glint" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset=".5" stop-color="#ffffff" stop-opacity=".45"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <pattern id="hatch" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
    <rect width="20" height="20" fill="#f7f7f7"/>
    <rect x="10" width="10" height="20" fill="#efefef"/>
  </pattern>
</defs>
  <style>
    text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .rise { animation: rise .7s cubic-bezier(.22,1,.36,1) both; transform-box: fill-box; }
    .d1 { animation-delay: .08s; } .d2 { animation-delay: .18s; }
    .d3 { animation-delay: .3s; } .d4 { animation-delay: .42s; }
    .d5 { animation-delay: .54s; } .d6 { animation-delay: .66s; }
    .d7 { animation-delay: .78s; } .d8 { animation-delay: .9s; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: none; }
    }
    .pill {
      transform-box: fill-box; transform-origin: left center;
      animation: pill 16s cubic-bezier(.22,1,.36,1) infinite;
    }
    @keyframes pill {
      0%, 16% { transform: translateX(0); }
      24%, 40% { transform: translateX(108px); }
      48%, 62% { transform: translateX(214px); }
      70%, 84% { transform: translateX(308px); }
      92%, 100% { transform: translateX(0); }
    }
    .menu {
      opacity: 0; transform: translateY(-6px);
      transform-box: fill-box; transform-origin: top center;
      animation: menu 16s cubic-bezier(.22,1,.36,1) infinite;
    }
    @keyframes menu {
      0%, 6% { opacity: 0; transform: translateY(-6px); }
      10%, 28% { opacity: 1; transform: none; }
      34%, 100% { opacity: 0; transform: translateY(-6px); }
    }
    .chev {
      transform-box: fill-box; transform-origin: center;
      animation: chev 16s cubic-bezier(.22,1,.36,1) infinite;
    }
    @keyframes chev {
      0%, 6% { transform: rotate(0deg); }
      10%, 28% { transform: rotate(180deg); }
      34%, 100% { transform: rotate(0deg); }
    }
    .glint { animation: sweep 6.8s ease-in-out infinite; transform-box: fill-box; transform-origin: left center; }
    @keyframes sweep {
      0%, 58% { transform: translateX(0); }
      100% { transform: translateX(460px); }
    }
    .home { animation: home 14s ease-in-out infinite; }
    .sched { opacity: 0; animation: sched 14s ease-in-out infinite; }
    @keyframes home {
      0%, 38% { opacity: 1; }
      48%, 88% { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes sched {
      0%, 38% { opacity: 0; }
      48%, 88% { opacity: 1; }
      100% { opacity: 0; }
    }
    .lane { animation: slide .65s cubic-bezier(.22,1,.36,1) both; transform-box: fill-box; }
    @keyframes slide {
      from { opacity: 0; transform: translateX(-12px); }
      to { opacity: 1; transform: none; }
    }
    .clash { animation: pulse 2.2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
    .live { animation: blink 1.5s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: .25; } }
    .check {
      fill: none; stroke: #171717; stroke-width: 1.8;
      stroke-linecap: round; stroke-linejoin: round;
      stroke-dasharray: 20; stroke-dashoffset: 20;
      animation: draw 5.2s cubic-bezier(.22,1,.36,1) infinite;
    }
    @keyframes draw {
      0% { stroke-dashoffset: 20; }
      14%, 76% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 20; }
    }
    .float { animation: float 6.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center top; }
    .float2 { animation-delay: -2.4s; }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .tick { opacity: 0; animation: tick 6.4s cubic-bezier(.22,1,.36,1) infinite; transform-box: fill-box; }
    .t1 { animation-delay: 1.6s; } .t2 { animation-delay: 3.2s; } .t3 { animation-delay: 4.8s; }
    @keyframes tick {
      0% { opacity: 0; transform: translateY(6px); }
      3%, 24% { opacity: 1; transform: none; }
      28%, 100% { opacity: 0; transform: translateY(-6px); }
    }
    .dest { opacity: 0; animation: dest 9s cubic-bezier(.22,1,.36,1) infinite both; transform-box: fill-box; }
    .s2 { animation-delay: 3s; } .s3 { animation-delay: 6s; }
    @keyframes dest {
      0% { opacity: 0; transform: translateY(10px); }
      6%, 28% { opacity: 1; transform: none; }
      34%, 100% { opacity: 0; transform: translateY(-10px); }
    }
    .hi { animation: hi 7.2s cubic-bezier(.22,1,.36,1) infinite; }
    .h2 { animation-delay: 2.4s; } .h3 { animation-delay: 4.8s; }
    @keyframes hi {
      0%, 8% { opacity: 0; }
      14%, 30% { opacity: 1; }
      38%, 100% { opacity: 0; }
    }
    .rule {
      stroke-dasharray: 1000; stroke-dashoffset: 1000;
      animation: rule 3.4s cubic-bezier(.22,1,.36,1) infinite;
    }
    @keyframes rule {
      0% { stroke-dashoffset: 1000; opacity: 0; }
      18% { opacity: 1; }
      62%, 100% { stroke-dashoffset: 0; opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .rise, .pill, .menu, .chev, .glint, .home, .sched, .lane, .clash, .live,
      .check, .float, .tick, .dest, .hi, .rule { animation: none; }
      .menu, .sched, .tick, .dest { opacity: 0; }
      .dest.show, .tick.show { opacity: 1; }
      .check { stroke-dashoffset: 0; }
      .rise, .lane { opacity: 1; transform: none; }
    }
</style>
  <rect width="1200" height="820" fill="#ffffff"/>
  
  
  <rect x="483.0" y="36" width="234" height="42" rx="21" fill="#f3f3f3"/>
  <text x="600" y="63" text-anchor="middle" fill="#404040" font-size="18" font-weight="650">Tournaments</text>

  <text class="rise" x="600" y="148" text-anchor="middle" fill="#171717" font-size="40" font-weight="700" letter-spacing="-1.1">Automate dozens of hours of tournament admin</text>
  <rect x="40" y="180" width="1120" height="468" rx="16" fill="#ffffff" stroke="#e5e5e5"/>
  <line x1="600" y1="180" x2="600" y2="648" stroke="#ececec"/>
  <text x="72" y="230" fill="#171717" font-size="22" font-weight="650">Set venues, teams, and format</text>
  <text x="72" y="262" fill="#737373" font-size="16">Walk through details, teams, format, playoffs, and referees.</text>
  <text x="72" y="286" fill="#737373" font-size="16">VOS builds the weekend around your courts and time slots.</text>
  <text x="632" y="230" fill="#171717" font-size="22" font-weight="650">Publish a public tournament page</text>
  <text x="632" y="262" fill="#737373" font-size="16">Clubs can find the event, and teams get a live schedule</text>
  <text x="632" y="286" fill="#737373" font-size="16">they can open without signing in.</text>
  <rect x="72" y="314" width="496" height="300" rx="14" fill="#f7f8fa"/>
  <text x="92" y="346" fill="#737373" font-size="12" font-weight="700" letter-spacing="1.2">SPREADSHEET</text>
  <rect x="92" y="360" width="456" height="188" rx="8" fill="#ffffff" stroke="#e5e5e5"/>
  <rect x="93" y="361" width="454" height="30" fill="#f3f3f3"/>
  <rect x="100" y="365" width="78" height="22" rx="4" fill="#ffffff"/>
  <text x="112" y="381" fill="#171717" font-size="12" font-weight="650">Schedule</text>
  <text x="188" y="381" fill="#737373" font-size="12">Teams</text>
  <text x="240" y="381" fill="#737373" font-size="12">Refs</text>
  <text x="284" y="381" fill="#737373" font-size="12">Email list</text>
  <text x="108" y="410" fill="#737373" font-size="12">Time</text>
  <text x="164" y="410" fill="#737373" font-size="12">Court 1</text>
  <text x="308" y="410" fill="#737373" font-size="12">Court 2</text>
  <text x="468" y="410" fill="#737373" font-size="12">Notes</text>
  
      <g class="rise" style="animation-delay:0.25s">
        
        <text x="108" y="430" fill="#171717" font-size="13">9:00</text>
        <text x="164" y="430" fill="#171717" font-size="13">Storm vs Pacific</text>
        <text x="308" y="430" fill="#171717" font-size="13" font-weight="500">Surge vs North</text>
        <text x="468" y="430" fill="#a3a3a3" font-size="13">version 7</text>
      </g>
      <g class="rise" style="animation-delay:0.35s">
        <rect class="clash" x="300" y="442" width="148" height="26" rx="4" fill="#fdeeee"/>
        <text x="108" y="460" fill="#171717" font-size="13">10:10</text>
        <text x="164" y="460" fill="#171717" font-size="13">Crest vs Harbour</text>
        <text x="308" y="460" fill="#9b2c2c" font-size="13" font-weight="650">Surge vs North</text>
        <text x="468" y="460" fill="#a3a3a3" font-size="13">which one?</text>
      </g>
      <g class="rise" style="animation-delay:0.45s">
        
        <text x="108" y="490" fill="#171717" font-size="13">11:20</text>
        <text x="164" y="490" fill="#171717" font-size="13">Pacific vs North</text>
        <text x="308" y="490" fill="#a3a3a3" font-size="13" font-weight="500">TBD</text>
        <text x="468" y="490" fill="#a3a3a3" font-size="13">refs blank</text>
      </g>
  <text x="92" y="588" fill="#9b2c2c" font-size="14">Court 2 is double-booked. Clubs still need the file.</text>
  <rect x="632" y="314" width="496" height="300" rx="14" fill="#f7f8fa"/>
  <text x="652" y="346" fill="#1c74bb" font-size="12" font-weight="700" letter-spacing="1.2">VOS</text>
  
      <text x="656" y="422" fill="#737373" font-size="12" font-weight="600">Court 1</text>
      <g class="lane" style="animation-delay:0.2s">
        <rect x="728" y="392" width="196" height="50" rx="8" fill="#ffffff" stroke="#e7eef5"/>
        <text x="740" y="414" fill="#171717" font-size="13" font-weight="650">Storm vs Pacific</text>
        <text x="740" y="432" fill="#737373" font-size="12">9:00</text>
      </g>
      <g class="lane" style="animation-delay:0.32s">
        <rect x="934" y="392" width="196" height="50" rx="8" fill="#ffffff" stroke="#e7eef5"/>
        <text x="946" y="414" fill="#171717" font-size="13" font-weight="650">Crest vs Harbour</text>
        <text x="946" y="432" fill="#737373" font-size="12">10:10</text>
      </g>
      <text x="656" y="484" fill="#737373" font-size="12" font-weight="600">Court 2</text>
      <g class="lane" style="animation-delay:0.32s">
        <rect x="728" y="454" width="196" height="50" rx="8" fill="#ffffff" stroke="#e7eef5"/>
        <text x="740" y="476" fill="#171717" font-size="13" font-weight="650">Surge vs North</text>
        <text x="740" y="494" fill="#737373" font-size="12">9:00</text>
      </g>
      <g class="lane" style="animation-delay:0.44s">
        <rect x="934" y="454" width="196" height="50" rx="8" fill="#ffffff" stroke="#e7eef5"/>
        <text x="946" y="476" fill="#171717" font-size="13" font-weight="650">Pacific vs North</text>
        <text x="946" y="494" fill="#737373" font-size="12">10:10</text>
      </g>
      <text x="656" y="546" fill="#737373" font-size="12" font-weight="600">Court 3</text>
      <g class="lane" style="animation-delay:0.44s">
        <rect x="728" y="516" width="196" height="50" rx="8" fill="#ffffff" stroke="#e7eef5"/>
        <text x="740" y="538" fill="#171717" font-size="13" font-weight="650">Ridge vs Valley</text>
        <text x="740" y="556" fill="#737373" font-size="12">9:00</text>
      </g>
      <g class="lane" style="animation-delay:0.56s">
        <rect x="934" y="516" width="196" height="50" rx="8" fill="#ffffff" stroke="#e7eef5"/>
        <text x="946" y="538" fill="#171717" font-size="13" font-weight="650">North vs Surge</text>
        <text x="946" y="556" fill="#737373" font-size="12">11:20</text>
      </g>
  <text x="652" y="588" fill="#404040" font-size="14">One public link. Same weekend, no double-bookings.</text>
  <rect x="40" y="672" width="1120" height="112" rx="16" fill="url(#hatch)" stroke="#ececec"/>
  <rect x="64" y="692" width="124" height="72" rx="14" fill="#ffffff" stroke="#e5e5e5"/>
  <text class="tick show" x="126" y="738" text-anchor="middle" fill="#171717" font-size="30" font-weight="700">12</text>
  <text class="tick t1" x="126" y="738" text-anchor="middle" fill="#171717" font-size="30" font-weight="700">48</text>
  <text class="tick t2" x="126" y="738" text-anchor="middle" fill="#171717" font-size="30" font-weight="700">80</text>
  <text class="tick t3" x="126" y="738" text-anchor="middle" fill="#171717" font-size="28" font-weight="700">100+</text>
  <text x="212" y="724" fill="#171717" font-size="20" font-weight="650">Schedule hundreds of teams</text>
  <text x="212" y="752" fill="#737373" font-size="16">Built for club and provincial volleyball weekends, not generic sports software.</text>

</svg>
